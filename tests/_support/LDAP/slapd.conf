include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb
TLSCertificateFile /tls/server.pem
TLSCertificateKeyFile /tls/server.key
TLSCACertificateFile /tls/ca.pem
security simple_bind=128

database mdb
maxsize 10485760
suffix "dc=example,dc=test"
rootdn "cn=operator,dc=example,dc=test"
directory /var/lib/shield-ldap

access to attrs=userPassword
    by anonymous auth
    by self write
    by * none
access to *
    by dn.exact="cn=reader,dc=example,dc=test" read
    by * none
