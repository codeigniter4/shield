name: PHPStan

on:
  pull_request:
    branches:
      - develop
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpstan.dist.neon'
      - '.github/workflows/phpstan.yml'
  push:
    branches:
      - develop
    paths:
      - '**.php'
      - 'composer.json'
      - 'phpstan.dist.neon'
      - '.github/workflows/phpstan.yml'

permissions:
  contents: read

jobs:
  phpstan:
    uses: codeigniter4/.github/.github/workflows/phpstan.yml@CI47
