name: Psalm

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - 'composer.json'
      - 'psalm.xml'
      - 'psalm-baseline.xml'
      - 'psalm_autoload.php'
      - '.github/workflows/psalm.yml'
  push:
    branches:
      - develop
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - 'composer.json'
      - 'psalm.xml'
      - 'psalm-baseline.xml'
      - 'psalm_autoload.php'
      - '.github/workflows/psalm.yml'

permissions:
  contents: read

jobs:
  psalm:
    uses: codeigniter4/.github/.github/workflows/psalm.yml@CI47
