name: Rector

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - 'composer.json'
      - 'rector.php'
      - '.github/workflows/rector.yml'
  push:
    branches:
      - develop
    paths:
      - 'src/**.php'
      - 'tests/**.php'
      - 'composer.json'
      - 'rector.php'
      - '.github/workflows/rector.yml'

permissions:
  contents: read

jobs:
  rector:
    uses: codeigniter4/.github/.github/workflows/rector.yml@CI47
