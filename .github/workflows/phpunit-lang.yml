name: Language Unit Tests

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'src/Language/**.php'
      - '!src/Language/en/**.php'
      - 'phpunit.dist.xml'
      - '.github/workflows/phpunit-lang.yml'
      - 'tests/Language/AbstractTranslationTestCase.php'
  push:
    branches:
      - develop
    paths:
      - 'src/Language/**.php'
      - '!src/Language/en/**.php'
      - 'phpunit.dist.xml'
      - '.github/workflows/phpunit-lang.yml'
      - 'tests/Language/AbstractTranslationTestCase.php'

jobs:
  main:
    name: Language Unit Tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.2'
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.2-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            composer-8.2-
            composer-

      - name: Install dependencies
        run: composer update --ansi

      - name: Test with PHPUnit
        run: vendor/bin/phpunit --no-coverage tests/Language
        env:
          TERM: xterm-256color
          TACHYCARDIA_MONITOR_GA: enabled
          PYRAMETER_DISABLED: 1
